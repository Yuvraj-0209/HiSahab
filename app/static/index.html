<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover so the safe-area-inset-* values in app.css are non-zero on a
         notched phone; without it the tab bar sits under the home indicator. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0b0d" />

    <!--
      Content-Security-Policy (CLAUDE.md §13.19, §14).

      This is a control, not a precaution. §13.19 records that the session token is readable
      by JavaScript -- a bearer-token API requires that -- so any script running on this
      origin can read it. The policy below is what keeps "any script" equal to "our scripts".

        default-src 'self'   nothing loads from anywhere else, full stop
        script-src  'self'   no inline <script>, no CDN. §14 forbids the npm dependency and
                             a CDN is the same dependency with worse failure modes
        style-src   'self'   app.css only; no inline <style>
        connect-src 'self' https://*.supabase.co
                             the API is same-origin; Supabase Auth and Storage are the one
                             external host we deliberately talk to (login, and the signed
                             URLs GET /attachments/{id}/url hands back)
        img-src     'self' data: https://*.supabase.co
                             data: for inline SVG glyphs; supabase for receipt images
        form-action 'none'   every form is submitted by fetch(); a real form POST would be
                             a bug, and this makes it a blocked one
        base-uri / frame-ancestors 'none'
                             no <base> hijack, and this app is never framed
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="
        default-src 'self';
        script-src 'self';
        style-src 'self';
        img-src 'self' data: https://*.supabase.co;
        font-src 'self';
        connect-src 'self' https://*.supabase.co;
        form-action 'none';
        base-uri 'none';
        frame-ancestors 'none';
      "
    />
    <meta name="referrer" content="same-origin" />

    <title>HiSahab</title>

    <!--
      The wordmark face, preloaded because it is discovered late: the browser only
      finds an @font-face URL after parsing app.css and matching a rule, by which
      point the login header has already painted in the fallback and will reflow.

      Self-hosted, never a CDN. §14 forbids the dependency and §13.19 makes any
      third-party asset able to read the session token; `font-src 'self'` above is
      what permits this file and refuses Google's. Licence: /fonts/OFL.txt.

      crossorigin is REQUIRED even same-origin -- fonts are always fetched in CORS
      mode, and without it the preload is discarded and the file fetched twice.
    -->
    <link
      rel="preload"
      href="/fonts/InstrumentSerif-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!--
      The login backdrop, preloaded for the same reason and one step worse: it is
      the largest contentful paint on the first screen, and it is discovered only
      after app.css parses AND js/backdrop/skyline.js runs. imagesrcset mirrors
      the <img> exactly so a phone still fetches the 1280 file, not the 2560 one.
      Licence and provenance: /img/CREDITS.txt.
    -->
    <link
      rel="preload"
      as="image"
      href="/img/city-1280.webp"
      imagesrcset="/img/city-1280.webp 1280w, /img/city-2560.webp 2560w"
      imagesizes="100vw"
    />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <!--
      The whole application renders into #app. This document is the only one the server ever
      serves: routing is hash-based (see js/router.js), so a deep link never asks for a second
      document and the StaticFiles mount needs no SPA fallback rewrite.

      Nothing below is a template. Every node is built in JavaScript with createElement and
      textContent -- §14 forbids innerHTML on server-derived values, because with a readable
      token (§13.19) an injected <img onerror> is a session theft, not a cosmetic bug.
    -->
    <!--
      The login backdrop mounts here (js/backdrop/skyline.js) and nothing else ever does.

      It is a SIBLING of #app rather than a child, and that is load-bearing rather than
      tidy: js/main.js replaces the whole of #app when a session starts, so a canvas living
      inside it would be torn down mid-frame while its animation loop kept running against
      a node no longer in the document.

      aria-hidden because it is decoration, not content, and pointer-events:none (app.css)
      because a fixed, full-viewport layer must never sit between a finger and the form.
    -->
    <div id="backdrop" aria-hidden="true"></div>

    <div id="app">
      <noscript>
        <div class="screen">
          <h1 class="t-title">JavaScript is required</h1>
          <p class="t-body">
            HiSahab is a client-side application that talks to the HiSahab API. Please
            enable JavaScript.
          </p>
        </div>
      </noscript>
    </div>

    <!-- Toasts and sheets mount here, outside #app, so a screen swap cannot tear down a
         message about the request that caused it. -->
    <div id="layers"></div>

    <!-- Announces toasts to a screen reader. An error that is only visual is not an error
         everybody can see. -->
    <div id="live" class="sr-only" role="status" aria-live="polite"></div>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
