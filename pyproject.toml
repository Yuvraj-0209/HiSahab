[project]
name = "hisahab"
version = "0.1.0"
description = "Daily stock and cash-flow manager for a fuel station"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    # Phase 12: the crypto extra is required. Supabase used to sign access tokens with
    # HS256 (symmetric, no extra needed), but projects created since its move to JWT
    # signing keys issue ES256 over P-256 -- verifying an elliptic-curve signature needs
    # `cryptography`, which the extra pulls in. Both schemes stay supported; see
    # app/core/jwks.py for why that is an improvement and not just a workaround.
    "PyJWT[crypto]>=2.9",
    # Phase 8, both forced by §7.1's proxy-upload choice. python-multipart: FastAPI cannot
    # parse multipart/form-data (the receipt upload) without it. httpx: promoted from dev-
    # only -- app/services/storage.py calls the Supabase Storage REST API directly rather
    # than pulling in a full Supabase SDK (CLAUDE.md §16).
    "python-multipart>=0.0.18",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# Phase 12. `packages.find` collects Python packages; the frontend is data files inside one,
# so without this the wheel installs an `app` package with no `static/` and `create_app`
# logs "frontend build not found" in production while working perfectly from a source
# checkout. That is a deployment-only failure, which is the worst kind to discover late.
#
# Phase 23: `static/` is Vite's build output (frontend/ -> app/static/), so the list became a
# glob. A forgotten file can no longer fall outside it; what can go missing now is the BUILD
# ITSELF, and the deploy configuration runs `npm run build` before anything is packaged
# (CLAUDE.md §13.28). The licence files travel with the assets -- SIL OFL requires it for the
# font, and CREDITS.txt is the Adobe Stock provenance for the photograph -- because Vite copies
# frontend/public/ into the build verbatim.
[tool.setuptools.package-data]
app = ["static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Each test function gets a fresh event loop; no shared-loop surprises.
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
