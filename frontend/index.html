<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The Content-Security-Policy is a response header set by FastAPI (Phase 23, §13.19),
         not a <meta> tag: a meta tag cannot carry frame-ancestors. -->
    <meta name="referrer" content="same-origin" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f4f6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0c0d0f" />
    <title>HiSahab</title>
    <meta name="description" content="Readings, collections, udhaar and the bank statement, reconciled every night for your petrol pump." />
    <link rel="preload" href="/fonts/InstrumentSerif-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Installable (Phase 24 D8): opened from a phone's home screen, the app runs full-screen.
         No service worker -- an offline queue of money writes is a different system (§12). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="HiSahab" />
    <!-- The link preview when somebody shares the address, on WhatsApp most likely. og:image needs
         an absolute address, so vite.config.ts adds it only when PUBLIC_ORIGIN is set at build. -->
    <meta property="og:title" content="HiSahab" />
    <meta property="og:description" content="The day's cash, checked against the meters." />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <!-- Sheets and toasts mount here, outside #root, so #root can go inert behind a sheet. -->
    <div id="layers"></div>
    <!-- Errors are announced as well as drawn. -->
    <div id="live" class="sr-only-text" aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
